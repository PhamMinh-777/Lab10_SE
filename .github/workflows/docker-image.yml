name: Docker Image CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build MVC application
        run: dotnet publish src/MvcApp/MvcApp.csproj -c Release
      - name: Build Razor Pages application
        run: dotnet publish src/RazorPagesApp/RazorPagesApp.csproj -c Release
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push MVC image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/lab10-mvc:latest
      - name: Build and push Razor Pages image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/RazorPagesApp/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/lab10-razor:latest
